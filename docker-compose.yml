# PicGalleryServer 部署编排
#
# 【镜像来源说明】
# 本项目已接入 GitHub Actions 自动构建流水线:
#   工作流文件:.github/workflows/docker-publish.yml
#   触发条件:向 main 分支推送代码,或推送 v* 版本标签
#   镜像仓库:GitHub Container Registry (GHCR)
#   镜像地址:ghcr.io/dming623/picgalleryserver
#
# 因此 app 服务默认【不再本地构建】,直接拉取流水线构建好的镜像。
# 首次部署请先执行一次 `docker compose pull` 拉取镜像,再执行 `docker compose up -d`。
#
# 【升级策略】示例固定到具体版本号,避免 `up` 时被动升级到未经测试的新版本。
# 升级时手动把 PGS_TAG 改成目标版本,再 `docker compose pull && docker compose up -d`。
#
# 【必填项】把 .env 放在本文件同级目录(参考 .env.example),至少设置:
#   PGS_ADMIN_PASSWORD / PGS_SESSION_SECRET / PGS_DB_PASSWORD
# 未设置时 compose 会直接报错退出,不会用默认弱密码启动。

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: pgs
      POSTGRES_PASSWORD: ${PGS_DB_PASSWORD:?请在 .env 中设置 PGS_DB_PASSWORD}
      POSTGRES_DB: picgallery
    volumes:
      - pgdata:/var/lib/postgresql/data
    # 健康检查:让 app 等数据库真正可连接后再启动,避免启动瞬间的
    # "the database system is starting up" 竞态错误
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pgs -d picgallery"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  app:
    image: ghcr.io/dming623/picgalleryserver:${PGS_TAG:-1.3.5}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      # 默认只监听本机,由反向代理对外提供服务;直接对外暴露时改成 "3000:3000"
      - "127.0.0.1:3000:3000"
    environment:
      DATABASE_URL: postgresql://pgs:${PGS_DB_PASSWORD}@db:5432/picgallery
      ADMIN_USER: ${PGS_ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${PGS_ADMIN_PASSWORD:?请在 .env 中设置 PGS_ADMIN_PASSWORD}
      SESSION_SECRET: ${PGS_SESSION_SECRET:?请在 .env 中设置 PGS_SESSION_SECRET}
      # 分池并发:图片 / 视频 / HEIC 各自上限,避免大批量导入时 OOM
      THUMB_CONCURRENCY: ${PGS_THUMB_CONCURRENCY:-4}
      VIDEO_CONCURRENCY: ${PGS_VIDEO_CONCURRENCY:-2}
      HEIC_CONCURRENCY: ${PGS_HEIC_CONCURRENCY:-1}
      # 容器内存限制下必须显式给 V8 堆上限,否则按宿主机内存估算会被 OOM Killer 杀掉
      NODE_OPTIONS: --max-old-space-size=${PGS_NODE_HEAP_MB:-1024}
      # 反向代理场景:信任 1 层反代取真实 IP;反代必须覆盖写入 X-Real-IP
      TRUST_PROXY: ${PGS_TRUST_PROXY:-0}
      # PUBLIC_BASE_URL: https://pics.example.com
      # ALLOWED_MOUNT_ROOTS: /photos
    volumes:
      - ./data:/app/data
      # 把 VPS 上已有的图片目录以【只读】方式挂进容器,再在后台「挂载服务器目录」。
      # 只读挂载可以彻底避免误删/误改你的原始照片目录。
      # - /srv/photos:/photos:ro
    # 资源限制:按实际机器调整;同时记得同步 PGS_NODE_HEAP_MB
    # mem_limit: 2g
    # cpus: 2.0
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

volumes:
  pgdata:
