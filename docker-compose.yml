# PicGalleryServer 部署编排
#
# 【镜像来源说明】
# 本项目已接入 GitHub Actions 自动构建流水线:
#   工作流文件:.github/workflows/docker-publish.yml
#   触发条件:向 main 分支推送代码,或推送 v* 版本标签
#   镜像仓库:GitHub Container Registry (GHCR)
#   镜像地址:ghcr.io/dming623/picgalleryserver
#
# 因此 app 服务默认【不再本地构建】,直接拉取流水线构建好的镜像。
# 首次部署请先执行一次 `docker compose pull` 拉取镜像,再执行 `docker compose up -d`。
#
# 【升级策略】示例固定到具体版本号,避免 `up` 时被动升级到未经测试的新版本。
# 升级时手动把 PGS_TAG 改成目标版本,再 `docker compose pull && docker compose up -d`。
#
# 【必填项】把 .env 放在本文件同级目录(参考 .env.example),至少设置:
#   PGS_ADMIN_PASSWORD / PGS_SESSION_SECRET / PGS_DB_PASSWORD
# 未设置时 compose 会直接报错退出,不会用默认弱密码启动。

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: pgs
      POSTGRES_PASSWORD: ${PGS_DB_PASSWORD:?请在 .env 中设置 PGS_DB_PASSWORD}
      POSTGRES_DB: picgallery
    volumes:
      - pgdata:/var/lib/postgresql/data
    # 健康检查:让 app 等数据库真正可连接后再启动,避免启动瞬间的
    # "the database system is starting up" 竞态错误
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pgs -d picgallery"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  app:
    image: ghcr.io/dming623/picgalleryserver:${PGS_TAG:-1.4.3}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      # 默认只监听本机,由反向代理对外提供服务;直接对外暴露时改成 "3000:3000"
      - "127.0.0.1:3000:3000"
    environment:
      # ======================================================================
      # 变量传递规则(重要)
      #   本段是【白名单】:容器只会收到下面列出的变量,.env 里的其它内容不会进入容器。
      #   写法 `NAME: ${NAME:-}` = 用 .env 里的同名变量;没设置时传空串,由 config.ts 采用代码默认值
      #   (config.ts 对空串一律按"未设置"处理,因此【不要】在这里再硬编码默认值,否则会盖掉按 CPU 自适应的默认)。
      #   历史上的 PGS_* 旧名仍然兼容:${NAME:-${PGS_NAME:-}} = 无前缀优先,其次旧名。
      #   新增配置项时必须同步在这里加一行,scripts/check-config.mjs 会校验(漏映射 = 静默失效)。
      # ======================================================================

      # ---- 数据库与账号 ----
      DATABASE_URL: postgresql://pgs:${PGS_DB_PASSWORD}@db:5432/picgallery
      # 数据库驱动:postgres(默认) | sqlite
      #   想用「单文件 SQLite」部署时,把 DB_DRIVER 设为 sqlite 并去掉对 db 服务的依赖
      #   (见文件末尾的「SQLite 部署」说明),适合图片数量不多的个人图库。
      DB_DRIVER: ${DB_DRIVER:-${PGS_DB_DRIVER:-postgres}}
      SQLITE_FILE: ${SQLITE_FILE:-${PGS_SQLITE_FILE:-/app/data/pgs.sqlite}}
      ADMIN_USER: ${ADMIN_USER:-${PGS_ADMIN_USER:-admin}}
      ADMIN_PASSWORD: ${PGS_ADMIN_PASSWORD:?请在 .env 中设置 PGS_ADMIN_PASSWORD}
      SESSION_SECRET: ${PGS_SESSION_SECRET:?请在 .env 中设置 PGS_SESSION_SECRET}
      DATABASE_SSL: ${DATABASE_SSL:-}
      DB_POOL_MAX: ${DB_POOL_MAX:-}
      DB_STATEMENT_TIMEOUT_MS: ${DB_STATEMENT_TIMEOUT_MS:-}
      DB_CONNECT_TIMEOUT_MS: ${DB_CONNECT_TIMEOUT_MS:-}
      # 站点默认时区(IANA):通知发布时间与日期分组按它换算,默认 Asia/Shanghai。
      # 部署后仍可在「设置 → 系统状态 → 时区」里修改,历史通知显示时间会同步变化。
      TZ: ${TZ:-Asia/Shanghai}

      # ---- 性能 / 并发(空 = 使用 config.ts 默认:图片并发按 CPU 核数自适应) ----
      THUMB_CONCURRENCY: ${THUMB_CONCURRENCY:-${PGS_THUMB_CONCURRENCY:-}}
      VIDEO_CONCURRENCY: ${VIDEO_CONCURRENCY:-${PGS_VIDEO_CONCURRENCY:-}}
      HEIC_CONCURRENCY: ${HEIC_CONCURRENCY:-${PGS_HEIC_CONCURRENCY:-}}
      THUMB_WIDTH: ${THUMB_WIDTH:-}
      PREVIEW_WIDTH: ${PREVIEW_WIDTH:-}
      EXIF_READ_BYTES: ${EXIF_READ_BYTES:-}
      # libuv 线程池:镜像默认 12;1C1G 小机器建议 4
      UV_THREADPOOL_SIZE: ${UV_THREADPOOL_SIZE:-12}
      # 容器内存限制下必须显式给 V8 堆上限,否则按宿主机内存估算会被 OOM Killer 杀掉
      NODE_OPTIONS: --max-old-space-size=${PGS_NODE_HEAP_MB:-1024}

      # ---- 上传 / 存储 / 扫描 ----
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-}
      MIN_FREE_DISK_MB: ${MIN_FREE_DISK_MB:-}
      JSON_BODY_MAX_KB: ${JSON_BODY_MAX_KB:-}
      CORRUPT_AUTO_PURGE_HOURS: ${CORRUPT_AUTO_PURGE_HOURS:-}
      ALLOWED_MOUNT_ROOTS: ${ALLOWED_MOUNT_ROOTS:-}
      SCAN_INTERVAL_MIN: ${SCAN_INTERVAL_MIN:-}
      SCAN_MAX_DEPTH: ${SCAN_MAX_DEPTH:-}
      SCAN_PRUNE_MAX_RATIO: ${SCAN_PRUNE_MAX_RATIO:-}
      SCAN_PRUNE_MIN_COUNT: ${SCAN_PRUNE_MIN_COUNT:-}
      FFMPEG_PATH: ${FFMPEG_PATH:-}
      FFPROBE_PATH: ${FFPROBE_PATH:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-}
      S3_PREFIX: ${S3_PREFIX:-}

      # ---- 安全 / 反向代理 / 限流 ----
      # 反向代理场景:TRUST_PROXY=1 表示信任 1 层反代取真实 IP;反代必须覆盖写入 X-Real-IP
      TRUST_PROXY: ${TRUST_PROXY:-${PGS_TRUST_PROXY:-}}
      # HTTPS 反代后设为 true,Cookie 加 Secure
      COOKIE_SECURE: ${COOKIE_SECURE:-}
      SESSION_DAYS: ${SESSION_DAYS:-}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-}
      GUEST_META: ${GUEST_META:-}
      GUEST_NOTE: ${GUEST_NOTE:-}
      SEARCH_RATE_PER_MIN: ${SEARCH_RATE_PER_MIN:-}
      KEY_RATE_PER_MIN: ${KEY_RATE_PER_MIN:-}

      # ---- 高清预览(HD) ----
      HD_WIDTH: ${HD_WIDTH:-}
      HD_MAX_HEIGHT: ${HD_MAX_HEIGHT:-}
      HD_QUALITY: ${HD_QUALITY:-}
      HD_CONCURRENCY: ${HD_CONCURRENCY:-}
      HD_MAX_INPUT_MP: ${HD_MAX_INPUT_MP:-}
      HD_CACHE_MAX_MB: ${HD_CACHE_MAX_MB:-}
      HD_CACHE_TTL_DAYS: ${HD_CACHE_TTL_DAYS:-}
      HD_TOKEN_TTL_SEC: ${HD_TOKEN_TTL_SEC:-}
      HD_RATE_IP_PER_MIN: ${HD_RATE_IP_PER_MIN:-}
      HD_RATE_USER_PER_MIN: ${HD_RATE_USER_PER_MIN:-}
      HD_RATE_MEDIA_PER_MIN: ${HD_RATE_MEDIA_PER_MIN:-}
      HD_RATE_TOKEN_PER_MIN: ${HD_RATE_TOKEN_PER_MIN:-}
      HD_SCAN_DISTINCT: ${HD_SCAN_DISTINCT:-}
      HD_SCAN_WINDOW_SEC: ${HD_SCAN_WINDOW_SEC:-}
      HD_SCAN_BLOCK_SEC: ${HD_SCAN_BLOCK_SEC:-}
      HD_WM_ENABLED: ${HD_WM_ENABLED:-}
      HD_WM_TEXT: ${HD_WM_TEXT:-}
      HD_WM_OPACITY: ${HD_WM_OPACITY:-}
      HD_WM_FONT_SIZE: ${HD_WM_FONT_SIZE:-}
      HD_WM_ANGLE: ${HD_WM_ANGLE:-}
      HD_WM_DENSITY: ${HD_WM_DENSITY:-}
      HD_WM_USER: ${HD_WM_USER:-}
      # 中文水印字体:需把字体文件挂进容器,这里填容器内路径
      HD_WM_FONT_FILE: ${HD_WM_FONT_FILE:-}

      # ---- 【显式不映射】(登记在 scripts/check-config.mjs 的 NOT_MAPPED 里) ----
      # PORT / DATA_DIR / HD_CACHE_DIR:容器内路径与端口是固定的(3000、/app/data),
      #   宿主机路径请用 volumes 与 ports 调整,不要通过环境变量改容器内部布局。
      # PGS_TAG / PGS_DB_PASSWORD / PGS_NODE_HEAP_MB:仅 compose 自用。
    volumes:
      - ./data:/app/data
      # 把 VPS 上已有的图片目录以【只读】方式挂进容器,再在后台「挂载服务器目录」。
      # 只读挂载可以彻底避免误删/误改你的原始照片目录。
      # - /srv/photos:/photos:ro
    # 资源限制:按实际机器调整,取消注释即可生效;同时记得同步 PGS_NODE_HEAP_MB(堆上限约为 mem_limit 的 25%~35%)
    # 对照表见 README「资源配置建议」。例:1C1G → mem_limit: 1g / cpus: 1.0 / PGS_NODE_HEAP_MB=320
    # mem_limit: 2g
    # cpus: 2.0
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

volumes:
  pgdata:

# ---------------------------------------------------------------------------
# 【SQLite 部署(可选)】图片数量不多时可以不跑 PostgreSQL,直接用单文件 SQLite:
#   1. 把 app 的 environment 里 DB_DRIVER 设为 sqlite(PGS_DB_DRIVER=sqlite)
#   2. 删掉 app 的 depends_on(db 服务),或保留 db 但不用它
#   3. 数据文件默认落在 /app/data/pgs.sqlite(已随 ./data 挂载持久化)
# 该模式无需任何外部数据库,适合手机本地 / 小规模自用;多实例部署请仍用 PostgreSQL。
# ---------------------------------------------------------------------------
