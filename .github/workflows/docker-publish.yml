name: 构建并发布 Docker 镜像

# 说明:代码推送到 main 分支或推送 v* 版本标签时,自动构建多架构镜像并推送到 GitHub Container Registry(GHCR)
# 镜像地址:ghcr.io/dming623/picgalleryserver
# 标签策略:
#   latest      —— main 分支最新构建 / v* 版本标签
#   main        —— main 分支构建
#   sha-<短哈希> —— 每次提交的精确版本
#   v1.2.3      —— 推送 v* 标签时的语义化版本号
#
# 镜像保留策略:
#   每次构建成功后自动删除 GHCR 中的旧版本,只保留【最新】与【前一个】两个镜像版本,
#   其余(含各次 sha-* 与历史 v* 版本)全部清理,避免仓库体积无限增长。

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

permissions:
  contents: read   # 检出代码
  packages: write  # 推送镜像到 GHCR

jobs:
  build-and-push:
    name: 构建并推送镜像
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 规范化镜像名称(GHCR 要求全小写)
        id: image
        run: echo "repo=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: 设置 QEMU 模拟(用于构建 ARM64 架构)
        uses: docker/setup-qemu-action@v3

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成镜像标签与元数据
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.image.outputs.repo }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
            type=ref,event=branch
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.title=PicGalleryServer
            org.opencontainers.image.description=自托管的图片与视频相册服务
            org.opencontainers.image.vendor=DMing623
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=PolyForm-Noncommercial-1.0.0

      - name: 构建并推送镜像(linux/amd64 + linux/arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 使用 GitHub Actions 缓存加速重复构建
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 验证镜像已推送且可匿名拉取
        continue-on-error: true
        run: |
          TOKEN=$(curl -sf "https://ghcr.io/token?scope=repository:${{ steps.image.outputs.repo }}:pull&service=ghcr.io" | jq -r .token)
          if curl -sf -H "Authorization: Bearer $TOKEN" \
               -H "Accept: application/vnd.oci.image.index.v1+json" \
               "https://ghcr.io/v2/${{ steps.image.outputs.repo }}/manifests/latest" > /dev/null; then
            echo "✅ 镜像可匿名拉取"
          else
            echo "⚠️ 镜像暂不可匿名拉取。若仓库为私有,请在仓库 Packages 页面手动将容器包设为 Public,"
            echo "   或在服务器执行 docker login ghcr.io 后再拉取。"
          fi

  cleanup-old-versions:
    name: 清理旧镜像(仅保留最新两个)
    runs-on: ubuntu-latest
    needs: build-and-push
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write # 删除旧镜像版本需要

    steps:
      - name: 规范化镜像名称(GHCR 要求全小写)
        id: image
        run: echo "repo=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: 删除除最新两个版本之外的旧镜像
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          REPO: picgalleryserver
        run: |
          set -uo pipefail
          # 个人账户与组织两种归属,依次尝试列出该容器包的版本
          LIST=""
          for API in "/users/${OWNER}/packages/container/${REPO}/versions" \
                     "/orgs/${OWNER}/packages/container/${REPO}/versions"; do
            LIST=$(gh api --paginate "${API}?per_page=100" \
                    --jq '.[] | [.id, .created_at, (.metadata.container.tags // [] | join(","))] | @tsv' 2>/dev/null) && break
          done
          if [ -z "$LIST" ]; then
            echo "::warning::未找到容器包 ${OWNER}/${REPO},跳过清理"
            exit 0
          fi
          echo "清理前共 $(printf '%s\n' "$LIST" | wc -l | tr -d ' ') 个版本:"
          printf '%s\n' "$LIST" | sed 's/^/  /'
          # 按创建时间倒序,保留最新两个(最新 + 前一个)
          KEEP_IDS=$(printf '%s\n' "$LIST" | sort -t"$(printf '\t')" -k2 -r | head -2 | cut -f1)
          echo "保留版本 ID: $(echo "$KEEP_IDS" | tr '\n' ' ')"
          printf '%s\n' "$LIST" | while IFS="$(printf '\t')" read -r ID CREATED TAGS; do
            [ -z "${ID:-}" ] && continue
            # 安全规则:带 latest 标签的版本永不删除(latest 永远指向最新构建)
            if printf '%s\n' "$KEEP_IDS" | grep -qx "$ID" || printf '%s' "$TAGS" | grep -q "latest"; then
              echo "  ✔ 保留 $ID  $CREATED  [$TAGS]"
              continue
            fi
            echo "  ✖ 删除 $ID  $CREATED  [$TAGS]"
            gh api -X DELETE "/users/${OWNER}/packages/container/${REPO}/versions/${ID}" 2>/dev/null \
              || gh api -X DELETE "/orgs/${OWNER}/packages/container/${REPO}/versions/${ID}" 2>/dev/null \
              || echo "    !! 删除失败: $ID"
          done

      - name: 列出清理后剩余的镜像版本
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO="${{ steps.image.outputs.repo }}"
          echo "仓库: $REPO"
          gh api "/users/${{ github.actor }}/packages/container/${REPO}/versions?per_page=100" \
            --jq '.[] | "  id=\(.id)  tags=\(.metadata.container.tags | join(","))  created=\(.created_at)"' \
            || gh api "/orgs/${{ github.repository_owner }}/packages/container/${REPO}/versions?per_page=100" \
            --jq '.[] | "  id=\(.id)  tags=\(.metadata.container.tags | join(","))  created=\(.created_at)"' \
            || echo "（无法列出版本，清理步骤可能已按预期完成）"
