name: 构建并发布 Docker 镜像

# 说明:代码推送到 main 分支或推送 v* 版本标签时,自动构建多架构镜像并推送到 GitHub Container Registry(GHCR)
# 镜像地址:ghcr.io/dming623/picgalleryserver
# 标签策略:
#   latest      —— main 分支最新构建 / v* 版本标签
#   main        —— main 分支构建
#   sha-<短哈希> —— 每次提交的精确版本
#   v1.2.3      —— 推送 v* 标签时的语义化版本号

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

permissions:
  contents: read   # 检出代码
  packages: write  # 推送镜像到 GHCR

jobs:
  build-and-push:
    name: 构建并推送镜像
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 规范化镜像名称(GHCR 要求全小写)
        id: image
        run: echo "repo=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: 设置 QEMU 模拟(用于构建 ARM64 架构)
        uses: docker/setup-qemu-action@v3

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成镜像标签与元数据
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.image.outputs.repo }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
            type=ref,event=branch
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.title=PicGalleryServer
            org.opencontainers.image.description=自托管的图片与视频相册服务
            org.opencontainers.image.vendor=DMing623
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=MIT

      - name: 构建并推送镜像(linux/amd64 + linux/arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 使用 GitHub Actions 缓存加速重复构建
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 将 GHCR 镜像包设为公开(便于服务器免登录拉取)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method PATCH \
            -H "Accept: application/vnd.github+json" \
            "/user/packages/container/${{ github.event.repository.name }}" \
            -f visibility=public
